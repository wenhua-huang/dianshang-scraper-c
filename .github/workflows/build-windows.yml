name: Build Windows Executable

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Extract version
        shell: pwsh
        run: |
          $version = python -c 'from pathlib import Path; import tomllib; print(tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])'
          if (-not $version) { throw 'Failed to parse version from pyproject.toml' }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build executable
        shell: pwsh
        run: |
          pyinstaller --onefile --name scraper-client src/scraper_client/app/main.py --distpath ./dist --workpath ./build

      - name: Stage package
        shell: pwsh
        run: |
          $pkgDir = "staging/scraper-client-$env:VERSION-windows-x86_64"
          New-Item -ItemType Directory -Force -Path $pkgDir | Out-Null
          Copy-Item -Path "dist/scraper-client.exe" -Destination "$pkgDir/scraper-client.exe" -Force
          Copy-Item -Path ".env.example" -Destination "$pkgDir/.env.example" -Force
          Copy-Item -Path "scripts/start.bat" -Destination "$pkgDir/start.bat" -Force

      - name: Smoke check
        shell: pwsh
        run: |
          $exe = "./staging/scraper-client-$env:VERSION-windows-x86_64/scraper-client.exe"
          & $exe --help
          $env:SCRAPER_SERVER_BASE_URL = "http://127.0.0.1:8000/api/v1"
          $env:SCRAPER_INTERNAL_API_KEY = "ci-smoke-key"
          $env:PLAYWRIGHT_CDP_URL = "http://127.0.0.1:9222"
          $env:SCRAPER_SKIP_BACKEND_CHECK = "1"
          cmd /c "staging\scraper-client-$env:VERSION-windows-x86_64\start.bat --check-only"

      - name: Archive package
        shell: pwsh
        run: |
          $zipName = "scraper-client-$env:VERSION-windows-x86_64.zip"
          Compress-Archive -Path "staging/scraper-client-$env:VERSION-windows-x86_64" -DestinationPath $zipName -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: scraper-client-${{ env.VERSION }}-windows-x86_64
          path: scraper-client-${{ env.VERSION }}-windows-x86_64.zip
          if-no-files-found: error
