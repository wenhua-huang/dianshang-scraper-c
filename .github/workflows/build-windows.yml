name: Build Windows Executable

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_dispatch:
    inputs:
      package_target:
        description: Package target environment
        required: true
        type: choice
        default: prod
        options:
          - prod
          - test
          - both
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Extract version
        id: extract_version
        shell: pwsh
        run: |
          $version = python -c 'from pathlib import Path; import tomllib; print(tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])'
          if (-not $version) { throw 'Failed to parse version from pyproject.toml' }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Determine package targets
        id: determine_targets
        shell: pwsh
        run: |
          $targets = @("prod")
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            switch ("${{ inputs.package_target }}") {
              "test" { $targets = @("test") }
              "both" { $targets = @("test", "prod") }
              default { $targets = @("prod") }
            }
          }
          "PACKAGE_TARGETS=$($targets -join ',')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $uploadTest = if ($targets -contains "test") { "true" } else { "false" }
          $uploadProd = if ($targets -contains "prod") { "true" } else { "false" }
          "upload_test=$uploadTest" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "upload_prod=$uploadProd" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build executable
        shell: pwsh
        run: |
          pyinstaller --onefile --console --name scraper-client src/scraper_client/app/main.py --distpath ./dist --workpath ./build --copy-metadata dianshang-scraper-c

      - name: Stage package
        shell: pwsh
        run: |
          $targets = $env:PACKAGE_TARGETS -split ","
          foreach ($target in $targets) {
            $pkgDir = "package/scraper-client-$env:VERSION-windows-x86_64-$target"
            $targetEnvFile = ".env.$target"

            if (-not (Test-Path $targetEnvFile)) {
              throw "Missing environment file: $targetEnvFile"
            }

            New-Item -ItemType Directory -Force -Path $pkgDir | Out-Null
            Copy-Item -Path "dist/scraper-client.exe" -Destination "$pkgDir/scraper-client-$target.exe" -Force
            Copy-Item -Path ".env.example" -Destination "$pkgDir/.env.example" -Force
            Copy-Item -Path ".env.example" -Destination "$pkgDir/env.example" -Force
            Copy-Item -Path $targetEnvFile -Destination "$pkgDir/$targetEnvFile" -Force
            Copy-Item -Path $targetEnvFile -Destination "$pkgDir/env.$target" -Force
            Set-Content -Path "$pkgDir/.package-env" -Value $target -NoNewline
            Set-Content -Path "$pkgDir/package-env" -Value $target -NoNewline
          }

      - name: Smoke check
        shell: pwsh
        run: |
          $targets = $env:PACKAGE_TARGETS -split ","
          foreach ($target in $targets) {
            $pkgDir = "package/scraper-client-$env:VERSION-windows-x86_64-$target"
            $exe = "./$pkgDir/scraper-client-$target.exe"
            & $exe --help

            $env:SCRAPER_SERVER_BASE_URL = "http://127.0.0.1:8000/api/v1"
            $env:SCRAPER_INTERNAL_API_KEY = "ci-smoke-key"
            $env:PLAYWRIGHT_CDP_URL = "http://127.0.0.1:9222"
            $env:SCRAPER_SKIP_BACKEND_CHECK = "1"
            $env:SCRAPER_ENV_FILE = ".env.$target"
            & $exe start-$target --help
          }

      - name: Upload artifact (test)
        if: steps.determine_targets.outputs.upload_test == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: scraper-client-${{ steps.extract_version.outputs.version }}-windows-x86_64-test
          path: package/scraper-client-${{ steps.extract_version.outputs.version }}-windows-x86_64-test
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload artifact (prod)
        if: steps.determine_targets.outputs.upload_prod == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: scraper-client-${{ steps.extract_version.outputs.version }}-windows-x86_64-prod
          path: package/scraper-client-${{ steps.extract_version.outputs.version }}-windows-x86_64-prod
          include-hidden-files: true
          if-no-files-found: error
