[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dianshang-scraper-c"
version = "1.0.3"
description = "E-commerce scraper client (CDP-only, server-managed rounds)"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.44",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "pyinstaller>=6.0",
]

[project.scripts]
scraper-client = "scraper_client.app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
